<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentil de Palabras</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f4f8;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #wordList {
            margin-top: 20px;
        }
        .word-item {
            font-size: 1em;
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <h1>Percentil de Palabras del Chat</h1>
    <canvas id="wordChart" width="400" height="200"></canvas>
    <div id="wordList"></div>

    <script>
        const chatStorageKey = "chatMessages";
        const savedMessages = JSON.parse(localStorage.getItem(chatStorageKey)) || [];

        // Procesar palabras
        const allText = savedMessages.join(" ").toLowerCase();
        const words = allText.match(/\b\w+\b/g) || [];
        const totalWords = words.length;

        const wordCounts = {};
        words.forEach(word => {
            wordCounts[word] = (wordCounts[word] || 0) + 1;
        });

        // Calcular porcentaje
        const wordPercentages = {};
        for (let word in wordCounts) {
            wordPercentages[word] = ((wordCounts[word] / totalWords) * 100).toFixed(2);
        }

        // Mostrar lista
        const wordListDiv = document.getElementById("wordList");
        Object.keys(wordPercentages).sort((a,b) => wordPercentages[b] - wordPercentages[a]).forEach(word => {
            const div = document.createElement("div");
            div.classList.add("word-item");
            div.textContent = `${word}: ${wordPercentages[word]}% (${wordCounts[word]} veces)`;
            wordListDiv.appendChild(div);
        });

        // Preparar datos para la gráfica
        const topWords = Object.keys(wordPercentages)
            .sort((a,b) => wordPercentages[b] - wordPercentages[a])
            .slice(0, 10); // Top 10 palabras
        const topPercentages = topWords.map(w => wordPercentages[w]);

        const ctx = document.getElementById('wordChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: topWords,
                datasets: [{
                    label: '% de Palabras',
                    data: topPercentages,
                    backgroundColor: 'rgba(252, 0, 176, 0.7)',
                    borderColor: 'rgba(252, 0, 176, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        title: { display: true, text: 'Porcentaje (%)' }
                    }
                }
            }
        });
    </script>
</body>
</html>
