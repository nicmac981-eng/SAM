<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Percentil de Palabras en Tiempo Real</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial; padding: 20px; background-color: #f0f4f8; }
h1 { text-align: center; }
#wordList { margin-top: 20px; }
.word-item { margin: 3px 0; }
</style>
</head>
<body>
<h1>Percentil de Palabras del Chat (Tiempo Real)</h1>
<canvas id="wordChart" width="400" height="200"></canvas>
<div id="wordList"></div>

<script>
const wordListDiv = document.getElementById("wordList");
const ctx = document.getElementById("wordChart").getContext("2d");
let chart;

// Función para calcular porcentaje y actualizar UI
function actualizarPercentil() {
    const savedMessages = JSON.parse(localStorage.getItem("chatMessages")) || [];
    const allText = savedMessages.join(" ").toLowerCase();
    const words = allText.match(/\b\w+\b/g) || [];
    const totalWords = words.length;

    const wordCounts = {};
    words.forEach(word => {
        wordCounts[word] = (wordCounts[word] || 0) + 1;
    });

    const wordPercentages = {};
    for (let word in wordCounts) {
        wordPercentages[word] = ((wordCounts[word]/totalWords)*100).toFixed(2);
    }

    // Actualizar lista
    wordListDiv.innerHTML = "";
    Object.keys(wordPercentages)
        .sort((a,b)=> wordPercentages[b]-wordPercentages[a])
        .forEach(word=>{
            const div = document.createElement("div");
            div.classList.add("word-item");
            div.textContent = `${word}: ${wordPercentages[word]}% (${wordCounts[word]} veces)`;
            wordListDiv.appendChild(div);
        });

    // Actualizar gráfica (top 10)
    const topWords = Object.keys(wordPercentages)
        .sort((a,b)=> wordPercentages[b]-wordPercentages[a])
        .slice(0,10);
    const topPercentages = topWords.map(w=> wordPercentages[w]);

    if(chart) {
        chart.data.labels = topWords;
        chart.data.datasets[0].data = topPercentages;
        chart.update();
    } else {
        chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: topWords,
                datasets: [{
                    label: '% de palabras',
                    data: topPercentages,
                    backgroundColor: 'rgba(252,0,176,0.7)',
                    borderColor: 'rgba(252,0,176,1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: { y: { beginAtZero:true, max:100, title:{ display:true, text:'Porcentaje (%)' } } }
            }
        });
    }
}

// Inicializar
actualizarPercentil();

// Escuchar cambios en localStorage
window.addEventListener('storage', actualizarPercentil);

// También refrescar cada segundo por seguridad
setInterval(actualizarPercentil, 1000);
localStorage.removeItem("chatMessages");
</script>
</body>
</html>
